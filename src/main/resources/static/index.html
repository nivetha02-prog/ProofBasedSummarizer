<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProofSum — answers with evidence</title>
<style>
  :root {
    --paper: #fbfaf7;
    --ink: #1f2a37;
    --muted: #66707c;
    --line: #d9d5cc;
    --highlight: #fff3b0;
    --accent: #1d5c8f;
    --danger: #a12f2f;
    --ok: #2e6b3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.55 Georgia, "Times New Roman", serif;
  }
  header {
    padding: 28px 32px 18px; border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 26px; font-weight: normal; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

  main {
    display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 90px);
  }
  aside { border-right: 1px solid var(--line); padding: 24px; }
  section { padding: 24px 32px; max-width: 900px; }

  h2 { font-size: 15px; font-weight: normal; color: var(--muted); margin: 0 0 10px; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 6px; padding: 26px 16px;
    text-align: center; cursor: pointer; color: var(--muted);
  }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  input[type=file] { display: none; }
  .doc { margin-top: 18px; font-size: 14px; line-height: 1.5; }
  .doc b { font-weight: normal; color: var(--ink); }
  .sections { margin-top: 8px; color: var(--muted); }

  .ask { display: flex; gap: 8px; margin-bottom: 8px; }
  .ask input {
    flex: 1; padding: 11px 13px; font: inherit; border: 1px solid var(--line);
    border-radius: 4px; background: white; color: var(--ink);
  }
  button {
    font: inherit; font-size: 15px; padding: 10px 16px; border-radius: 4px;
    border: 1px solid var(--accent); background: var(--accent); color: white; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .status { font-size: 14px; color: var(--muted); min-height: 20px; margin-bottom: 14px; }
  .status.err { color: var(--danger); }

  .answer {
    background: white; border: 1px solid var(--line); border-radius: 6px; padding: 20px 22px; margin-bottom: 22px;
  }
  .answer .q { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .answer .a { white-space: pre-wrap; }
  .answer .a.notfound { color: var(--danger); }
  .tag {
    display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 3px;
    background: var(--highlight); color: var(--ink); margin-right: 2px; vertical-align: 1px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .evidence { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .evidence h3 { font-size: 14px; font-weight: normal; color: var(--muted); margin: 0 0 8px; }
  .ev { padding: 10px 12px; margin-bottom: 8px; border-left: 3px solid var(--highlight); background: #fffdf3; font-size: 15px; }
  .ev .meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .ev .meta .tag { background: var(--ink); color: white; }
  .empty { color: var(--muted); padding: 40px 0; }
  .model { font-size: 12px; color: var(--muted); margin-top: 10px; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--line); }
    section { padding: 20px; }
  }
</style>
</head>
<body>
<header>
  <h1>ProofSum</h1>
  <p>Upload a research paper, ask a question, and get an answer backed by page-cited excerpts.</p>
</header>

<main>
  <aside>
    <h2>Paper</h2>
    <label class="drop" id="drop" tabindex="0">
      Drop a PDF here or click to choose
      <input type="file" id="file" accept="application/pdf">
    </label>
    <div class="doc" id="doc"></div>
  </aside>

  <section>
    <h2>Question</h2>
    <div class="ask">
      <input id="question" placeholder="e.g. What accuracy does the model reach on the test set?" disabled>
      <button id="askBtn" disabled>Ask</button>
      <button id="sumBtn" class="secondary" disabled>Summarize</button>
    </div>
    <div class="status" id="status">Upload a PDF to begin.</div>
    <div id="results"><div class="empty">Answers will appear here, each with the excerpts that support it.</div></div>
  </section>
</main>

<script>
const API = '/api/papers';
let documentId = null;

const $ = id => document.getElementById(id);
const drop = $('drop'), fileInput = $('file'), status = $('status'), results = $('results');
const qInput = $('question'), askBtn = $('askBtn'), sumBtn = $('sumBtn');

function setStatus(msg, isErr = false) { status.textContent = msg; status.className = 'status' + (isErr ? ' err' : ''); }
function setReady(on) { qInput.disabled = askBtn.disabled = sumBtn.disabled = !on; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function tagCites(text) { return esc(text).replace(/\[(E\d+)\]/g, '<span class="tag">$1</span>'); }

// ---------- upload ----------
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) upload(fileInput.files[0]); });

async function upload(file) {
  setReady(false);
  setStatus('Reading and indexing ' + file.name + '…');
  $('doc').innerHTML = '';
  const fd = new FormData(); fd.append('file', file);
  try {
    const res = await fetch(API, { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.error || 'Upload failed');
    documentId = data.documentId;
    $('doc').innerHTML = `<b>${esc(data.fileName)}</b><br>${data.pages} pages, ${data.chunks} passages` +
      `<div class="sections">Sections found: ${data.sections.map(esc).join(', ')}</div>`;
    results.innerHTML = '<div class="empty">Indexed. Ask a question or request a summary.</div>';
    setStatus('Ready.');
    setReady(true); qInput.focus();
  } catch (err) {
    setStatus(err.message, true);
  }
}

// ---------- ask ----------
askBtn.addEventListener('click', ask);
qInput.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });

async function ask() {
  const question = qInput.value.trim();
  if (!question || !documentId) return;
  setReady(false); setStatus('Searching the paper…');
  try {
    const res = await fetch(API + '/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ documentId, question })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.error || 'Request failed');
    if (results.querySelector('.empty')) results.innerHTML = '';
    results.prepend(renderAnswer(data));
    setStatus('');
    qInput.value = '';
  } catch (err) {
    setStatus(err.message, true);
  } finally { setReady(true); qInput.focus(); }
}

// ---------- summary ----------
sumBtn.addEventListener('click', async () => {
  if (!documentId) return;
  setReady(false); setStatus('Building evidence-based summary…');
  try {
    const res = await fetch(`${API}/${documentId}/summary`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.error || 'Request failed');
    results.innerHTML = '';
    for (const key of Object.keys(data)) results.appendChild(renderAnswer(data[key], key));
    setStatus('');
  } catch (err) {
    setStatus(err.message, true);
  } finally { setReady(true); }
});

// ---------- render ----------
function renderAnswer(data, label) {
  const div = document.createElement('div');
  div.className = 'answer';
  const evidence = (data.evidence || []).map((e, i) => `
    <div class="ev">
      <div class="meta"><span class="tag">E${i + 1}</span> Page ${e.page} · ${esc(e.section)} · relevance ${e.score}</div>
      ${esc(e.excerpt)}
    </div>`).join('');
  div.innerHTML = `
    <div class="q">${label ? esc(label) + ' — ' : ''}${esc(data.question)}</div>
    <div class="a${data.found ? '' : ' notfound'}">${tagCites(data.answer)}</div>
    ${data.found ? `<div class="evidence"><h3>Supporting excerpts</h3>${evidence}</div>` : ''}
    <div class="model">Answered by: ${esc(data.model)}</div>`;
  return div;
}
</script>
</body>
</html>
