server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Temporary storage for uploaded PDFs
proofsum.storage.dir=./uploads

# Chunking
proofsum.chunk.size-words=220
proofsum.chunk.overlap-words=40

# Retrieval
proofsum.retrieval.top-k=6
proofsum.retrieval.min-score=0.05

# Embeddings: "local" (offline hashed TF vectors, no key needed)
# or "openai" (OpenAI-compatible /v1/embeddings endpoint)
proofsum.embedding.provider=local
proofsum.embedding.openai.url=https://api.openai.com/v1/embeddings
proofsum.embedding.openai.model=text-embedding-3-small
proofsum.embedding.openai.api-key=${OPENAI_API_KEY:}

# LLM: "anthropic" | "openai" | "none" (extractive fallback, no key needed)
proofsum.llm.provider=${LLM_PROVIDER:none}
proofsum.llm.anthropic.url=https://api.anthropic.com/v1/messages
proofsum.llm.anthropic.model=claude-sonnet-4-5
proofsum.llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
proofsum.llm.openai.url=https://api.openai.com/v1/chat/completions
proofsum.llm.openai.model=gpt-4o-mini
proofsum.llm.openai.api-key=${OPENAI_API_KEY:}
